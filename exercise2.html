<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 2 - Async/Await vs .then</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f8fafc;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-then {
            background-color: #7c3aed;
            color: white;
        }
        .btn-then:hover {
            background-color: #6d28d9;
        }
        .btn-async {
            background-color: #1a3a5c;
            color: white;
        }
        .btn-async:hover {
            background-color: #2c5a7c;
        }
        .btn-clear {
            background-color: #64748b;
            color: white;
        }
        .btn-clear:hover {
            background-color: #475569;
        }
        #result {
            margin-top: 16px;
            padding: 16px;
            background-color: #e2e8f0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            min-height: 60px;
        }
        .loading {
            background-color: #fef9c3 !important;
            color: #ca8a04;
        }
        .success {
            background-color: #dcfce7 !important;
            color: #16a34a;
        }
        .error {
            background-color: #fee2e2 !important;
            color: #dc2626;
        }
        .post {
            padding: 8px 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .post:last-child {
            border-bottom: none;
        }
        .post strong {
            color: #1a3a5c;
        }
        .badge {
            display: inline-block;
            background-color: #1a3a5c;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .method-label {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 .then vs Async/Await</h1>
        <p>Both methods fetch data from a public API. Compare the approaches.</p>

        <div class="btn-group">
            <button class="btn-then" id="thenBtn">📦 .then Chain</button>
            <button class="btn-async" id="asyncBtn">⚡ Async/Await</button>
            <button class="btn-clear" id="clearBtn">🗑️ Clear</button>
        </div>

        <div id="result">Click a button to fetch posts.</div>
    </div>

    <script>
        // ============================================
        // Exercise 2: .then vs Async/Await
        // ============================================

        const resultDiv = document.getElementById('result');
        const thenBtn = document.getElementById('thenBtn');
        const asyncBtn = document.getElementById('asyncBtn');
        const clearBtn = document.getElementById('clearBtn');

        // ============================================
        // METHOD 1: .then Chain (Original)
        // ============================================

        function fetchWithThen() {
            resultDiv.innerHTML = '⏳ Fetching with .then...';
            resultDiv.className = 'loading';

            fetch('https://jsonplaceholder.typicode.com/posts?_limit=3')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    renderPosts(data, '.then Chain');
                    resultDiv.className = 'success';
                    console.log('✅ .then chain completed');
                })
                .catch(error => {
                    resultDiv.innerHTML = `❌ Error: ${error.message}`;
                    resultDiv.className = 'error';
                    console.error('❌ .then error:', error);
                });
        }

        // ============================================
        // METHOD 2: Async/Await (Rewritten)
        // ============================================

        async function fetchWithAsyncAwait() {
            resultDiv.innerHTML = '⏳ Fetching with Async/Await...';
            resultDiv.className = 'loading';

            try {
                // Step 1: fetch
                const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=3');

                // Step 2: check response
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                // Step 3: parse JSON
                const data = await response.json();

                // Step 4: render
                renderPosts(data, 'Async/Await');
                resultDiv.className = 'success';
                console.log('✅ Async/Await completed');

            } catch (error) {
                resultDiv.innerHTML = `❌ Error: ${error.message}`;
                resultDiv.className = 'error';
                console.error('❌ Async/Await error:', error);
            }
        }

        // ============================================
        // Render Helper
        // ============================================

        function renderPosts(posts, method) {
            let html = `
                <div class="method-label">✅ ${method}</div>
                <div style="font-size:13px; color:#64748b; margin-bottom:8px;">
                    Fetched ${posts.length} posts
                </div>
            `;

            posts.forEach(post => {
                html += `
                    <div class="post">
                        <strong>${post.title}</strong>
                        <br />
                        <span style="font-size:13px; color:#64748b;">
                            Post #${post.id} by User ${post.userId}
                        </span>
                    </div>
                `;
            });

            resultDiv.innerHTML = html;
        }

        // ============================================
        // Event Listeners
        // ============================================

        thenBtn.addEventListener('click', fetchWithThen);
        asyncBtn.addEventListener('click', fetchWithAsyncAwait);

        clearBtn.addEventListener('click', function() {
            resultDiv.innerHTML = '🗑️ Cleared. Click a button to fetch again.';
            resultDiv.className = '';
        });

        // ============================================
        // Console Log
        // ============================================

        console.log('✅ Exercise 2 ready!');
        console.log('📦 .then chain and Async/Await both fetch the same data.');
        console.log('⚡ Notice how Async/Await is cleaner and easier to read.');
    </script>
</body>
</html>
