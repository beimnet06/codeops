<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Addis Market - Shopping List</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="container">
        <header>
            <h1>🛒 Addis Market</h1>
            <p class="subtitle">Your Ethiopian shopping list</p>
        </header>

        <!-- Add Item Form -->
        <form id="itemForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g., Injera" required />
                </div>
                <div class="form-group">
                    <label for="itemPrice">Price (ETB)</label>
                    <input type="number" id="itemPrice" placeholder="e.g., 50" min="0" step="0.01" required />
                </div>
                <button type="submit">➕ Add Item</button>
            </div>
        </form>

        <!-- Shopping List -->
        <div class="list-container">
            <div class="list-header">
                <h2>📋 Your Shopping List</h2>
                <span class="total-display">
                    Total: <span id="totalAmount">0.00</span> ETB
                </span>
            </div>

            <ul id="itemList">
                <li class="empty-message">📭 No items yet. Add your first item above!</li>
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
