<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .temp {
            font-size: 72px;
            font-weight: 700;
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #60a5fa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-white">🌤️ Weather App</h1>
            <p class="text-blue-300 text-sm">Enter a city name to get current weather</p>
        </div>

        <!-- Weather Card -->
        <div class="weather-card rounded-2xl p-6 text-white shadow-xl">
            <!-- Search -->
            <div class="flex gap-2 mb-4">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                    class="search-input flex-1 px-4 py-2 rounded-lg bg-white/10 text-white placeholder-blue-300/50 border border-white/20"
                />
                <button
                    id="searchBtn"
                    class="px-4 py-2 bg-blue-500 hover:bg-blue-600 rounded-lg font-semibold transition"
                >
                    Search
                </button>
            </div>

            <!-- Status / Loading -->
            <div id="status" class="text-center text-sm text-blue-300/70 py-2">Enter a city to get started</div>

            <!-- Weather Data -->
            <div id="weatherData" class="hidden">
                <div class="text-center">
                    <div id="cityName" class="text-2xl font-bold"></div>
                    <div id="temp" class="temp"></div>
                    <div id="condition" class="text-xl text-blue-300"></div>
                    <div class="grid grid-cols-3 gap-4 mt-4 pt-4 border-t border-white/10">
                        <div>
                            <p class="text-sm text-blue-300/70">Humidity</p>
                            <p id="humidity" class="font-semibold">--%</p>
                        </div>
                        <div>
                            <p class="text-sm text-blue-300/70">Wind</p>
                            <p id="wind" class="font-semibold">-- km/h</p>
                        </div>
                        <div>
                            <p class="text-sm text-blue-300/70">Feels Like</p>
                            <p id="feelsLike" class="font-semibold">--°C</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Error -->
            <div id="error" class="hidden text-center text-red-400 text-sm py-2"></div>
        </div>

        <!-- Footer -->
        <p class="text-center text-slate-500 text-xs mt-4">Data from goweather.herokuapp.com</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
