<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 - Flexbox Navbar</title>
    <style>
        /* ============================================
           Navbar Styles
           ============================================ */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a3a5c;
            padding: 16px 32px;
            border-radius: 8px;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        /* Nav Links Container */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* Nav Links */
        .nav-links a {
            color: white;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 16px;
            padding: 8px 4px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #f1c40f;
        }

        /* Button */
        .btn {
            background-color: #f1c40f;
            color: #1a3a5c;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #f39c12;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <!-- Logo -->
        <div class="logo">🏪 Habesha Market</div>

        <!-- Links + Button -->
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <button class="btn">Contact</button>
        </div>
    </nav>
</body>
</html>
