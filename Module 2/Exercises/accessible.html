<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible HTML - Fixed Snippets</title>
</head>
<body>
    <h1> Accessible HTML - Fixed Snippets</h1>

   
    <h2>Fix 1: Button</h2>


    <button type="button">Submit</button>
   
    <h2>Fix 2: Input with Label</h2>

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name">
  
    <h2>Fix 3: Image with Alt Text</h2>

    <img 
        src="https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=300" 
        alt="Freshly roasted Ethiopian coffee beans in a traditional jebena pot">
   
</body>
</html>
