<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 3-6 - Signup Form with localStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f8fafc;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a3a5c;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a3a5c;
        }
        .form-group .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
        button {
            padding: 10px 24px;
            background-color: #1a3a5c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
        }
        button:hover {
            background-color: #2c5a7c;
        }
        #errorArea {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            min-height: 20px;
        }
        .error {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }
        .success {
            background-color: #dcfce7;
            color: #16a34a;
            border: 1px solid #86efac;
        }
        .info {
            background-color: #dbeafe;
            color: #2563eb;
            border: 1px solid #93c5fd;
        }
        .signup-count {
            margin-top: 16px;
            padding: 12px;
            background-color: #e2e8f0;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
        .signup-count strong {
            color: #1a3a5c;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Signup Form</h1>
        <p>Sign up with your name and phone number.</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="nameInput">Full Name</label>
                <input type="text" id="nameInput" placeholder="e.g., Beimnet Tariku" />
                <div class="hint">At least 2 characters</div>
            </div>
            <div class="form-group">
                <label for="phoneInput">Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="+251912345678" />
                <div class="hint">Format: +251 followed by 9 digits</div>
            </div>
            <button type="submit">Sign Up</button>
        </form>

        <div id="errorArea"></div>

        <div class="signup-count">
            👥 Total signed up: <strong id="countDisplay">0</strong>
        </div>
    </div>

    <script>
        // ============================================
        // Exercises 3-6: Signup Form with localStorage
        // ============================================

        // DOM References
        const form = document.getElementById('signupForm');
        const nameInput = document.getElementById('nameInput');
        const phoneInput = document.getElementById('phoneInput');
        const errorArea = document.getElementById('errorArea');
        const countDisplay = document.getElementById('countDisplay');

        const STORAGE_KEY = 'signups';

        // ============================================
        // Helper: Load signups from localStorage
        // ============================================

        function loadSignups() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data === null) return [];
                const parsed = JSON.parse(data);
                if (!Array.isArray(parsed)) return [];
                return parsed;
            } catch {
                return [];
            }
        }

        // ============================================
        // Helper: Save signups to localStorage
        // ============================================

        function saveSignups(signups) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(signups));
                return true;
            } catch {
                return false;
            }
        }

        // ============================================
        // Helper: Update count display
        // ============================================

        function updateCount() {
            const signups = loadSignups();
            countDisplay.textContent = signups.length;
        }

        // ============================================
        // Helper: Validate Ethiopian phone number
        // ============================================

        function isValidEthiopianPhone(phone) {
            const regex = /^\+251[0-9]{9}$/;
            return regex.test(phone);
        }

        // ============================================
        // Form Submit Handler
        // ============================================

        form.addEventListener('submit', function(event) {
            // 1. Prevent default
            event.preventDefault();

            // 2. Clear previous errors
            errorArea.textContent = '';
            errorArea.className = '';

            // 3. Read trimmed values
            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();

            // 4. Validate: name at least 2 characters
            if (name.length < 2) {
                errorArea.textContent = '❌ Name must be at least 2 characters long.';
                errorArea.className = 'error';
                nameInput.focus();
                return;
            }

            // 5. Validate: phone against Ethiopian regex
            if (!isValidEthiopianPhone(phone)) {
                errorArea.textContent = '❌ Phone must be in format: +251 followed by 9 digits (e.g., +251912345678)';
                errorArea.className = 'error';
                phoneInput.focus();
                return;
            }

            // 6. Success: save to localStorage
            const signups = loadSignups();
            signups.push({ name, phone, signedAt: new Date().toISOString() });
            saveSignups(signups);

            // 7. Clear the form
            nameInput.value = '';
            phoneInput.value = '';

            // 8. Show success message
            errorArea.textContent = '✅ Signup successful! Welcome!';
            errorArea.className = 'success';

            // 9. Update count
            updateCount();

            console.log('✅ New signup:', { name, phone });
        });

        // ============================================
        // Load and display count on page load
        // ============================================

        updateCount();

        // ============================================
        // Console Log
        // ============================================

        console.log('✅ Exercises 3-6 ready!');
        console.log('📝 Signup form with localStorage validation.');
        console.log('📌 Phone validation: +251[0-9]{9}');
        console.log('👥 Total signups:', loadSignups().length);
    </script>
</body>
</html>
