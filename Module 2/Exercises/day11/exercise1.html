<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 1 - Theme Toggle with localStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            transition: background-color 0.3s, color 0.3s;
        }

        .light {
            background-color: #f8fafc;
            color: #1e293b;
        }

        .dark {
            background-color: #1e293b;
            color: #f8fafc;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 10px;
            text-align: center;
        }

        .light .container {
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .dark .container {
            background-color: #334155;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .light button {
            background-color: #1a3a5c;
            color: white;
        }

        .light button:hover {
            background-color: #2c5a7c;
        }

        .dark button {
            background-color: #f1c40f;
            color: #1e293b;
        }

        .dark button:hover {
            background-color: #e6b800;
        }

        .info {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .light .info {
            background-color: #e2e8f0;
            color: #475569;
        }

        .dark .info {
            background-color: #475569;
            color: #e2e8f0;
        }
    </style>
</head>
<body class="light">
    <div class="container">
        <h1>🎨 Theme Toggle</h1>
        <p>Your preference is saved in localStorage!</p>
        <button id="toggleBtn">Switch to Dark Mode</button>
        <div class="info" id="status">Current theme: Light</div>
    </div>

    <script>
        // ============================================
        // Exercise 1: Theme Toggle with localStorage
        // ============================================

        const body = document.body;
        const toggleBtn = document.getElementById('toggleBtn');
        const statusDiv = document.getElementById('status');

        // Function to apply theme
        function setTheme(theme) {
            if (theme === 'dark') {
                body.className = 'dark';
                toggleBtn.textContent = 'Switch to Light Mode';
                statusDiv.textContent = 'Current theme: Dark';
            } else {
                body.className = 'light';
                toggleBtn.textContent = 'Switch to Dark Mode';
                statusDiv.textContent = 'Current theme: Light';
            }
            // Save to localStorage
            localStorage.setItem('theme', theme);
        }

        // Function to toggle theme
        function toggleTheme() {
            const currentTheme = body.className;
            if (currentTheme === 'light') {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        }

        // Load saved theme from localStorage
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                // Default to light
                setTheme('light');
            }
        }

        // Event listener
        toggleBtn.addEventListener('click', toggleTheme);

        // Load theme on page load
        loadTheme();

        console.log('✅ Exercise 1 ready!');
        console.log('🎨 Theme preference saved in localStorage.');
    </script>
</body>
</html>
