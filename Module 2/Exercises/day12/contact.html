<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Habesha Eatery, Addis Ababa</title>
    <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa. Send us a message or check our opening hours.">
</head>
<body>
    <header>
        <h1>Contact Habesha Eatery</h1>
        <nav>
            <a href="index.html">Reservations</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Contact Form -->
        <section>
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <div>
                    <label for="contact_name">Name:</label>
                    <input type="text" id="contact_name" name="contact_name" required>
                </div>

                <div>
                    <label for="contact_email">Email:</label>
                    <input type="email" id="contact_email" name="contact_email" required>
                </div>

                <div>
                    <label for="contact_message">Message:</label>
                    <textarea id="contact_message" name="contact_message" rows="5" required></textarea>
                </div>

                <div>
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </section>

        <!-- Opening Hours Table -->
        <section>
            <h2>Opening Hours</h2>
            <figure>
                <figcaption>Our Hours of Operation</figcaption>
                <table>
                    <caption>Habesha Eatery Opening Hours</caption>
                    <thead>
                        <tr>
                            <th scope="col">Day</th>
                            <th scope="col">Hours</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Monday</td>
                            <td>10:00 – 22:00</td>
                        </tr>
                        <tr>
                            <td>Tuesday</td>
                            <td>10:00 – 22:00</td>
                        </tr>
                        <tr>
                            <td>Wednesday</td>
                            <td>10:00 – 22:00</td>
                        </tr>
                        <tr>
                            <td>Thursday</td>
                            <td>10:00 – 22:00</td>
                        </tr>
                        <tr>
                            <td>Friday</td>
                            <td>10:00 – 23:00</td>
                        </tr>
                        <tr>
                            <td>Saturday</td>
                            <td>09:00 – 23:00</td>
                        </tr>
                        <tr>
                            <td>Sunday</td>
                            <td>09:00 – 21:00</td>
                        </tr>
                    </tbody>
                </table>
            </figure>
        </section>
    </main>

    <footer>
        <p>Bole, Addis Ababa, Ethiopia</p>
        <p>&copy; 2026 Habesha Eatery</p>
    </footer>
</body>
</html>
