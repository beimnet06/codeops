<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations — Habesha Eatery, Addis Ababa</title>
    <meta name="description" content="Book a table at Habesha Eatery in Addis Ababa. Experience authentic Ethiopian cuisine in a warm and welcoming atmosphere.">
</head>
<body>
    <header>
        <h1>Habesha Eatery</h1>
        <nav>
            <a href="index.html">Reservations</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- ========== RESERVATION FORM ========== -->
        <section>
            <h2>Make a Reservation</h2>
            <form action="#" method="post">
                <div>
                    <label for="res_name">Full Name:</label>
                    <input type="text" id="res_name" name="res_name" required>
                </div>

                <div>
                    <label for="res_email">Email Address:</label>
                    <input type="email" id="res_email" name="res_email" required>
                </div>

                <div>
                    <label for="res_tel">Telephone:</label>
                    <input type="tel" id="res_tel" name="res_tel" 
                           pattern="\+251[0-9]{9}" 
                           placeholder="+251912345678"
                           required>
                    <small>Format: +251 followed by 9 digits</small>
                </div>

                <div>
                    <label for="res_date">Date:</label>
                    <input type="date" id="res_date" name="res_date" required>
                </div>

                <div>
                    <label for="res_time">Time:</label>
                    <input type="time" id="res_time" name="res_time" required>
                </div>

                <div>
                    <label for="res_guests">Number of Guests:</label>
                    <input type="number" id="res_guests" name="res_guests" min="1" max="20" required>
                </div>

                <div>
                    <button type="submit">Book Table</button>
                </div>
            </form>
        </section>

        <!-- ========== MENU TABLE ========== -->
        <section>
            <h2>Menu</h2>
            <figure>
                <figcaption>Our Popular Dishes</figcaption>
                <table>
                    <caption>Habesha Eatery Menu</caption>
                    <thead>
                        <tr>
                            <th scope="col">Dish</th>
                            <th scope="col">Description</th>
                            <th scope="col">Price (ETB)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Doro Wat</td>
                            <td>Spicy chicken stew with boiled eggs</td>
                            <td>350</td>
                        </tr>
                        <tr>
                            <td>Kitfo</td>
                            <td>Minced raw beef with spices</td>
                            <td>400</td>
                        </tr>
                        <tr>
                            <td>Tibs</td>
                            <td>Sautéed beef with vegetables</td>
                            <td>380</td>
                        </tr>
                        <tr>
                            <td>Shiro</td>
                            <td>Chickpea stew with berbere</td>
                            <td>250</td>
                        </tr>
                        <tr>
                            <td>Injera</td>
                            <td>Traditional Ethiopian flatbread</td>
                            <td>50</td>
                        </tr>
                    </tbody>
                </table>
            </figure>
        </section>

        <!-- ========== MEDIA BLOCK ========== -->
        <section>
            <h2>Gallery</h2>

            <figure>
                <img 
                    src="https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=500" 
                    alt="Traditional Ethiopian platter with various wats served on injera"
                    width="500"
                >
                <figcaption>Traditional Ethiopian platter — Doro Wat, Kitfo, and Tibs served on injera.</figcaption>
            </figure>

            <figure>
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126284.29215443645!2d38.71971889453125!3d9.031968700000005!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x164b85b4bf1c1b2f%3A0x3c5f6e5f4c8b9f8!2sAddis%20Ababa%2C%20Ethiopia!5e0!3m2!1sen!2sca!4v1700000000000!5m2!1sen!2sca" 
                    width="600" 
                    height="450" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Map showing Addis Ababa, Ethiopia"
                ></iframe>
                <figcaption>📍 Located in Bole, Addis Ababa, Ethiopia.</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Bole, Addis Ababa, Ethiopia</p>
        <p>&copy; 2026 Habesha Eatery</p>
    </footer>
</body>
</html>
