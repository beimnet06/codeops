<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birr Watch - Currency Converter</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Birr Watch</h1>
            <p>Live ETB exchange rates</p>
        </header>

        <!-- Status Container -->
        <div id="status"></div>

        <!-- Convert Form -->
        <form id="convertForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="amountInput">Amount (ETB)</label>
                    <input type="number" id="amountInput" placeholder="e.g., 100" step="0.01" min="0" />
                </div>
                <div class="form-group">
                    <label for="currencySelect">Target Currency</label>
                    <select id="currencySelect">
                        <option value="">Loading currencies...</option>
                    </select>
                </div>
            </div>
            <button type="submit">Convert</button>
        </form>

        <!-- Result Container -->
        <div id="result"></div>

        <!-- Watchlist -->
        <div class="watchlist-section">
            <div class="watchlist-header">
                <h2>⭐ Watchlist</h2>
                <div class="watchlist-add">
                    <input type="text" id="watchlistInput" placeholder="Enter currency code (e.g., USD)" />
                    <button id="addWatchBtn">➕ Add</button>
                </div>
            </div>
            <ul id="watchlist"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
