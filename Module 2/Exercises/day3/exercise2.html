<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 - Box Model</title>
    <style>
        .card {
            width: 300px;
            padding: 24px;
            border: 2px solid #333;
            background-color: #f0f0f0;
            margin-bottom: 20px;
        }

        .card-content-box {
            box-sizing: content-box;
        }

        .card-border-box {
            box-sizing: border-box;
        }

        .note {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Box Model: content-box vs border-box</h1>

    <h2>content-box (default)</h2>
    <div class="card card-content-box">
        Width: 300px + 48px padding + 4px border = 352px total
    </div>
    <p class="note"> This card is wider than 300px because padding and border are added.</p>

    <h2>border-box (fixed)</h2>
    <div class="card card-border-box">
        Width: 300px total (padding and border included)
    </div>
    <p class="note"> This card is exactly 300px wide.</p>
</body>
</html>
