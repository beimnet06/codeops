<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 3 - Event Bubbling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f8fafc;
        }

        .container {
            padding: 40px;
            background-color: #e2e8f0;
            border: 3px solid #94a3b8;
            border-radius: 12px;
            max-width: 500px;
            margin: 20px 0;
            text-align: center;
        }

        .container .label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .inner-box {
            padding: 30px;
            background-color: #cbd5e1;
            border: 3px solid #64748b;
            border-radius: 8px;
        }

        .inner-box .label {
            font-size: 14px;
            color: #475569;
            margin-bottom: 12px;
        }

        button {
            padding: 12px 32px;
            background-color: #1a3a5c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2c5a7c;
        }

        .log-area {
            margin-top: 20px;
            padding: 16px;
            background-color: #1a1a2e;
            color: #00ff88;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-width: 500px;
        }

        .log-area .entry {
            padding: 4px 0;
            border-bottom: 1px solid #2a2a4e;
        }

        .log-area .entry .target {
            color: #f1c40f;
        }

        .log-area .entry .current {
            color: #4fc3f7;
        }

        .btn-clear {
            padding: 6px 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .btn-clear:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>🔄 Event Bubbling Demo</h1>

    <div class="container" id="outerDiv">
        <div class="label">⬆️ OUTER DIV (Container)</div>
        <div class="inner-box" id="innerDiv">
            <div class="label">⬆️ INNER DIV</div>
            <button id="myButton">🎯 Click Me!</button>
        </div>
    </div>

    <div class="log-area" id="logArea">
        <div class="entry">🔵 Click the button to see event bubbling...</div>
    </div>
    <button class="btn-clear" id="clearBtn">Clear Log</button>

    <script>
        // ============================================
        // Exercise 3: Event Bubbling
        // ============================================

        // Select elements
        const outerDiv = document.getElementById('outerDiv');
        const innerDiv = document.getElementById('innerDiv');
        const button = document.getElementById('myButton');
        const logArea = document.getElementById('logArea');
        const clearBtn = document.getElementById('clearBtn');

        // Function to add log entry
        function logEvent(event, elementName) {
            const entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = `
                🎯 <span class="target">event.target:</span> ${event.target.tagName} 
                | <span class="current">currentTarget:</span> ${elementName}
                | Phase: ${event.eventPhase === 1 ? 'CAPTURING' : event.eventPhase === 2 ? 'AT TARGET' : 'BUBBLING'}
            `;
            logArea.appendChild(entry);
            // Auto-scroll
            logArea.scrollTop = logArea.scrollHeight;
        }

        // 1. Button click listener (logs event.target)
        button.addEventListener('click', function(event) {
            logEvent(event, 'BUTTON');
            console.log('Button clicked! event.target:', event.target);
        });

        // 2. Inner div listener
        innerDiv.addEventListener('click', function(event) {
            logEvent(event, 'INNER DIV');
            console.log('Inner div clicked! event.target:', event.target);
        });

        // 3. Outer div listener
        outerDiv.addEventListener('click', function(event) {
            logEvent(event, 'OUTER DIV');
            console.log('Outer div clicked! event.target:', event.target);
        });

        // 4. Clear log
        clearBtn.addEventListener('click', function() {
            logArea.innerHTML = '<div class="entry">🗑️ Log cleared. Click the button again!</div>';
        });

        // ============================================
        // Explanation
        // ============================================

        console.log('✅ Exercise 3 ready!');
        console.log('Click the button to see event bubbling.');
        console.log('Event phases: 1=CAPTURING, 2=AT TARGET, 3=BUBBLING');
    </script>

</body>
</html>
